plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = 'com.example'
base { archivesName = mod_id }

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
